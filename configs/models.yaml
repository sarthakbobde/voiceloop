# Phase 1 local stack, sized for a 4 GB GTX 1650 (ADR-002).
# vram_mib is what the stage added to GPU memory when measured on 2026-11-13 (ADR-009, ADR-010).
stack:
  vad:
    model: silero-vad
    device: cpu
    vram_mib: 0
  asr:
    model: faster-whisper small (int8)
    device: cuda
    vram_mib: 413
  llm:
    model: Qwen2.5-1.5B-Instruct Q4_K_M (GGUF)
    device: cuda
    vram_mib: 1154
  tts:
    model: kokoro-82m int8 (ONNX, via kokoro-onnx)
    device: cpu
    vram_mib: 0
